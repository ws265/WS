<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950">
  <rect width="100%" height="100%" fill="white"/>

  <style>
    .box { fill:#eeeeee; stroke:#000; stroke-width:3; }
    .outer { fill:none; stroke:#000; stroke-width:3; }
    .txt { font-family:Arial, sans-serif; font-size:28px; fill:#111; }
    .small { font-family:Arial, sans-serif; font-size:24px; fill:#111; }
  </style>

  <!-- Application layer -->
  <rect class="outer" x="40" y="40" width="1030" height="240"/>
  <text class="txt" x="90" y="150">Application</text>

  <rect class="box" x="360" y="80" rx="20" ry="20" width="570" height="90"/>
  <text class="txt" x="410" y="135">Object/Relational Mapping</text>

  <rect class="box" x="360" y="190" width="570" height="55"/>
  <text class="small" x="390" y="228">Data Local Reconstruction Layer(DLRL)</text>

  <rect class="box" x="1080" y="40" width="80" height="240"/>
  <text class="txt" transform="rotate(90 1120 160)" x="1120" y="160">DDS</text>

  <!-- DCPS -->
  <rect class="outer" x="40" y="300" width="1030" height="250"/>
  <text class="txt" x="360" y="535">Data Centric Publish/Subscribe (DCPS)</text>

  <rect class="box" x="80" y="350" width="250" height="80"/>
  <text class="small" x="125" y="400">Ownership</text>

  <rect class="box" x="370" y="350" width="250" height="80"/>
  <text class="small" x="430" y="400">Durability</text>

  <rect class="box" x="660" y="350" width="300" height="80"/>
  <text class="small" x="700" y="385">Content</text>
  <text class="small" x="700" y="420">Subscription</text>

  <rect class="box" x="80" y="450" width="880" height="70" rx="20" ry="20"/>
  <text class="small" x="370" y="495">Minimum Profile</text>

  <!-- DDSI -->
  <rect class="outer" x="40" y="580" width="1030" height="170"/>
  <rect class="box" x="80" y="620" width="880" height="70" rx="20" ry="20"/>
  <text class="small" x="220" y="665">DDS Interoperability Wire Protocol - DDSI-RTPS</text>
  <text class="txt" x="310" y="725">DDS Interoperability Wire Protocol</text>

  <rect class="box" x="1080" y="580" width="80" height="170"/>
  <text class="txt" transform="rotate(90 1120 665)" x="1120" y="665">DDSI</text>

  <!-- UDP -->
  <rect class="outer" x="40" y="780" width="1030" height="90"/>
  <text class="txt" x="500" y="835">UDP/IP</text>
</svg>